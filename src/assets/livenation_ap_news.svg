<svg xmlns="http://www.w3.org/2000/svg" width="840" height="180" viewBox="0 0 840 180" role="img" aria-labelledby="title desc">
  <title id="title">AP News antitrust verdict card</title>
  <desc id="desc">Stylized AP News card about Ticketmaster and Live Nation losing an antitrust trial in New York.</desc>
  <defs>
    <linearGradient id="surface" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fffefa"/>
      <stop offset="0.62" stop-color="#f3f0ea"/>
      <stop offset="1" stop-color="#d6ece4"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1" y1="1" y2="0">
      <stop offset="0" stop-color="#0f8f72" stop-opacity="0.22"/>
      <stop offset="0.48" stop-color="#356fa8" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#6d28d9" stop-opacity="0.12"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0f1512" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="840" height="180" rx="18" fill="url(#surface)"/>
  <rect width="840" height="180" rx="18" fill="url(#accent)"/>
  <g filter="url(#softShadow)">
    <rect x="28" y="22" width="784" height="136" rx="16" fill="#fffefa" fill-opacity="0.93"/>
  </g>
  <g transform="translate(54 42)">
    <circle cx="24" cy="24" r="24" fill="#f7f7f7" stroke="#d8d8d8"/>
    <text x="24" y="32" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="800" fill="#111111">AP</text>
    <path d="M10 39 H38" stroke="#e11d48" stroke-width="3.4" stroke-linecap="round"/>
  </g>
  <text x="116" y="58" font-family="Inter, Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#1c1b19">AP News</text>
  <text x="116" y="86" font-family="Inter, Arial, Helvetica, sans-serif" font-size="16" fill="#5f5d58">apnews.com - article - live-nation-ticketmaster</text>
  <text x="54" y="126" font-family="Inter, Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#5b18c9">Ticketmaster and Live Nation lose antitrust trial in New York</text>
  <text x="54" y="153" font-family="Inter, Arial, Helvetica, sans-serif" font-size="17" fill="#2c2a26">Apr 15, 2026 - Jury finds anticompetitive monopoly over big concert venues.</text>
  <circle cx="764" cy="56" r="3.4" fill="#6b6861"/>
  <circle cx="764" cy="72" r="3.4" fill="#6b6861"/>
  <circle cx="764" cy="88" r="3.4" fill="#6b6861"/>
</svg>
